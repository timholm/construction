apiVersion: apps/v1
kind: Deployment
metadata:
  name: construction
  namespace: construction
  labels:
    app: construction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: construction
  template:
    metadata:
      labels:
        app: construction
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 101
          readOnlyRootFilesystem: false
      volumes:
      - name: site
        configMap:
          name: construction-site
---
apiVersion: v1
kind: Service
metadata:
  name: construction
  namespace: construction
  labels:
    app: construction
spec:
  selector:
    app: construction
  ports:
  - name: http
    port: 80
    targetPort: 8080
